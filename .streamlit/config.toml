# WARS - Streamlit settings (local runs and Streamlit Community Cloud)
[server]
maxUploadSize = 50          # MB; one annual report (KLBF 2021, 470 pages) is 10.7 MB
enableStaticServing = true  # serves static/ (the Source fonts) at app/static/

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
# font families are registered under WARS names: Streamlit cannot use a family name with a digit
# ("Source Sans 3") in the theme, and it bundles its own "Source Sans" and "Source Serif"
base = "light"
primaryColor = "#006B53"
backgroundColor = "#F6F7F5"
secondaryBackgroundColor = "#EEF1EE"
textColor = "#1B1E23"
borderColor = "#D9DCD8"
font = "WARS Sans, sans-serif"
headingFont = "WARS Serif, serif"
codeFont = "WARS Mono, monospace"
baseRadius = "10px"

[[theme.fontFaces]]
family = "WARS Sans"
url = "app/static/fonts/SourceSans3-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "WARS Sans"
url = "app/static/fonts/SourceSans3-It.woff2"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "WARS Sans"
url = "app/static/fonts/SourceSans3-Semibold.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "WARS Sans"
url = "app/static/fonts/SourceSans3-SemiboldIt.woff2"
weight = 600
style = "italic"

[[theme.fontFaces]]
family = "WARS Sans"
url = "app/static/fonts/SourceSans3-Bold.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "WARS Serif"
url = "app/static/fonts/SourceSerif4-Semibold.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "WARS Mono"
url = "app/static/fonts/SourceCodePro-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "WARS Mono"
url = "app/static/fonts/SourceCodePro-Semibold.woff2"
weight = 600
style = "normal"
